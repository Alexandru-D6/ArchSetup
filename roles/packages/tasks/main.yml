---
- name: Install declared command-line packages from official repositories
  community.general.pacman:
    name: "{{ archsetup_cli_packages | difference(archsetup_cli_packages_absent) }}"
    state: present
    reason: explicit
    reason_for: new

- name: Remove explicitly undesired command-line packages
  community.general.pacman:
    name: "{{ archsetup_cli_packages_absent }}"
    state: absent
  when: archsetup_cli_packages_absent | length > 0
