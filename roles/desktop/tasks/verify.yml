---
- name: Verify enabled desktop
  when: archsetup_desktop_enabled | bool
  block:
    - name: Resolve configuration paths and verify adoption state
      ansible.builtin.import_tasks: preflight.yml

    - name: Gather installed package records
      ansible.builtin.package_facts:
        manager: pacman

    - name: Verify desktop dependencies
      ansible.builtin.assert:
        that: item in ansible_facts.packages
      loop: "{{ archsetup_desktop_packages + (archsetup_desktop_login_packages if (archsetup_desktop_manage_login | bool) else []) }}"

    - name: Check managed desktop files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ desktop_root }}/.managed"
        - "{{ desktop_root }}/hyprland.lua"
        - "{{ desktop_root }}/hyprlock.conf"
        - "{{ desktop_root }}/lock-power.conf"
        - "{{ desktop_root }}/bin/desktop-settings"
        - "{{ desktop_root }}/bin/desktop-controls"
        - "{{ desktop_root }}/bin/desktop_wifi.py"
        - "{{ desktop_root }}/bin/desktop-bluetooth"
        - "{{ desktop_root }}/shell/ControlCenter.qml"
        - "{{ desktop_root }}/shell/NotificationSource.qml"
        - "{{ desktop_root }}/bin/desktop_settings.py"
        - "{{ desktop_root }}/bin/desktop_system.py"
        - "{{ desktop_root }}/settings-input.lua"
        - "{{ desktop_root }}/shell/ConfigurationWindow.qml"
        - "{{ desktop_root }}/shell/shared/SettingsSource.qml"
        - "{{ desktop_root }}/lock/shared/SettingsSource.qml"
        - "{{ desktop_root }}/hypridle.conf"
        - "{{ desktop_root }}/kitty.conf"
        - "{{ desktop_root }}/themes.json"
        - "{{ desktop_root }}/theme/kitty.conf"
        - "{{ desktop_root }}/shell/shell.qml"
        - "{{ desktop_root }}/lock/shell.qml"
        - /usr/share/wayland-sessions/archsetup.desktop
        - /usr/local/bin/archsetup-session
        - /etc/pam.d/archsetup-hyprlock
      register: desktop_verified_files

    - name: Require all managed desktop files
      ansible.builtin.assert:
        that: item.stat.exists
      loop: "{{ desktop_verified_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Validate effective user settings without modifying them
      ansible.builtin.command:
        argv: ["{{ desktop_root }}/bin/desktop-settings"]
        stdin: '{"operation":"read"}'
      become_user: "{{ archsetup_desktop_user }}"
      changed_when: false
      check_mode: false

    - name: Check the default Kitty configuration
      ansible.builtin.stat:
        path: "{{ desktop_home }}/.config/kitty/kitty.conf"
      register: desktop_kitty_configuration

    - name: Require Kitty to use the managed desktop theme
      ansible.builtin.assert:
        that:
          - desktop_kitty_configuration.stat.exists
          - desktop_kitty_configuration.stat.islnk | default(false)
          - desktop_kitty_configuration.stat.lnk_source | default('') == desktop_root + '/theme/kitty.conf'
        fail_msg: Run desktop-apply to normalize the default Kitty configuration.

    - name: Read the VSCodium launcher flags
      ansible.builtin.slurp:
        src: "{{ desktop_home }}/.config/codium-flags.conf"
      register: desktop_vscodium_flags
      when: archsetup_desktop_code_editor == 'codium.desktop'

    - name: Require VSCodium to use GNOME Keyring
      ansible.builtin.assert:
        that:
          - "'--password-store=gnome-libsecret' in (desktop_vscodium_flags.content | b64decode).splitlines()"
        fail_msg: Run desktop-apply to configure VSCodium's GNOME Keyring backend.
      when: archsetup_desktop_code_editor == 'codium.desktop'

    - name: Validate the installed Lua configuration
      ansible.builtin.command:
        argv: [Hyprland, --verify-config, --config, "{{ desktop_root }}/hyprland.lua"]
      environment:
        XDG_RUNTIME_DIR: "{{ desktop_root }}/.runtime-validation"
      become_user: "{{ archsetup_desktop_user }}"
      changed_when: false
      check_mode: false
      register: desktop_config_validation
      failed_when: desktop_config_validation.rc != 0 or 'config ok' not in desktop_config_validation.stdout

    - name: Check login manager boot enablement
      ansible.builtin.command: systemctl is-enabled greetd.service
      changed_when: false
      check_mode: false
      when: archsetup_desktop_manage_login | bool

    - name: Explain remaining interactive checks
      ansible.builtin.debug:
        msg: Static installation checks passed. Login, PAM authentication, suspend/resume and GPU behavior require the graphical acceptance procedure in docs/hyprland-desktop.md.
