---
- name: Back up a pre-existing unmanaged profile once
  ansible.builtin.command:
    argv: [cp, -a, --, "{{ desktop_root }}", "{{ desktop_root }}.pre-archsetup"]
    creates: "{{ desktop_root }}.pre-archsetup"
  when:
    - desktop_existing.results[0].stat.exists
    - not desktop_existing.results[1].stat.exists
    - archsetup_desktop_adopt | bool

- name: Create owned configuration directories
  ansible.builtin.file:
    path: "{{ desktop_root }}/{{ item }}"
    state: directory
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0755'
  loop: ['', shell, bin, assets]

- name: Install the requested lock-screen wallpaper
  ansible.builtin.copy:
    src: assets/lock-wallpaper.jpg
    dest: "{{ desktop_root }}/assets/lock-wallpaper.jpg"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'

- name: Create private configuration-validation runtime directory
  ansible.builtin.file:
    path: "{{ desktop_root }}/.runtime-validation"
    state: directory
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0700'

- name: Install original desktop shell
  ansible.builtin.copy:
    src: shell/
    dest: "{{ desktop_root }}/shell/"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
  notify: Refresh running ArchSetup shell

- name: Install desktop helpers and shortcut map
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ desktop_root }}/{{ item.dest }}"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: desktop-action, dest: bin/desktop-action, mode: '0755'}
    - {src: desktop-record, dest: bin/desktop-record, mode: '0755'}
    - {src: lock-visuals, dest: bin/lock-visuals, mode: '0755'}
    - {src: session-services, dest: bin/session-services, mode: '0755'}
    - {src: validate-config, dest: bin/validate-config, mode: '0755'}
    - {src: shortcuts.json, dest: shortcuts.json, mode: '0644'}
    - {src: themes.json, dest: themes.json, mode: '0644'}
  register: desktop_installed_helpers

- name: Remove retired wallpaper and font files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ desktop_root }}/assets/default-wallpaper.png"
    - "{{ desktop_root }}/assets/README.md"
    - "{{ desktop_root }}/assets/licenses/dots-hyprland-GPL-3.0.txt"
    - "{{ desktop_home }}/.local/share/fonts/archsetup/GoogleSansFlex.ttf"
    - "{{ desktop_home }}/.local/share/fonts/archsetup/OFL.txt"
    - "{{ desktop_home }}/.local/share/fonts/archsetup/README.md"
  register: desktop_removed_assets

- name: Refresh the user font cache after removing bundled fonts
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.command:
    argv: [fc-cache]
  when: desktop_removed_assets.changed and not ansible_check_mode
  changed_when: true

- name: Install Hyprlock authentication and keyring integration
  ansible.builtin.copy:
    src: archsetup-hyprlock.pam
    dest: /etc/pam.d/archsetup-hyprlock
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Render desktop shell preferences
  become: true
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.template:
    src: preferences.json.j2
    dest: "{{ desktop_root }}/preferences.json"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    backup: true
  register: desktop_rendered_preferences
  notify: Refresh running ArchSetup shell

- name: Fit the native lock-screen identity badge
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.command:
    argv: ["{{ desktop_root }}/bin/lock-visuals", identity-config]
  register: desktop_lock_identity
  changed_when: desktop_lock_identity.stdout == 'changed'
  when: not ansible_check_mode

- name: Render desktop configuration
  become: true
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ desktop_root }}/{{ item }}"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    backup: true
    validate: "{{ desktop_root + '/bin/validate-config %s' if item == 'hyprland.lua' else omit }}"
  loop: [hyprland.lua, hyprlock.conf, hypridle.conf, fuzzel.ini, kitty.conf, swaync.json, swaync.css]
  register: desktop_rendered_configuration

- name: Initialize user-owned appearance state
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ desktop_root }}/state.json"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0600'
    force: false

- name: Create the default Kitty configuration directory
  ansible.builtin.file:
    path: "{{ desktop_home }}/.config/kitty"
    state: directory
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0755'

- name: Inspect the default Kitty configuration and generated theme
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ desktop_home }}/.config/kitty/kitty.conf"
    - "{{ desktop_root }}/theme/kitty.conf"
  register: desktop_kitty_existing

- name: Back up the previous default Kitty configuration once
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.command:
    argv:
      - cp
      - -a
      - --
      - "{{ desktop_home }}/.config/kitty/kitty.conf"
      - "{{ desktop_home }}/.config/kitty/kitty.conf.pre-archsetup"
    creates: "{{ desktop_home }}/.config/kitty/kitty.conf.pre-archsetup"
  when:
    - desktop_kitty_existing.results[0].stat.exists
    - desktop_kitty_existing.results[0].stat.lnk_source | default('') != desktop_root + '/theme/kitty.conf'

- name: Generate the current managed theme
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.command:
    argv: ["{{ desktop_root }}/bin/desktop-action", refresh-theme]
  when:
    - not ansible_check_mode
    - >-
      desktop_rendered_configuration.changed or desktop_rendered_preferences.changed
      or desktop_installed_helpers.changed or desktop_lock_identity.changed
      or not desktop_kitty_existing.results[1].stat.exists
  changed_when: true

- name: Use the desktop theme for all default Kitty launches
  ansible.builtin.file:
    path: "{{ desktop_home }}/.config/kitty/kitty.conf"
    src: "{{ desktop_root }}/theme/kitty.conf"
    state: link
    force: true
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"

- name: Validate rendered compositor configuration
  ansible.builtin.command:
    argv: [Hyprland, --verify-config, --config, "{{ desktop_root }}/hyprland.lua"]
  environment:
    XDG_RUNTIME_DIR: "{{ desktop_root }}/.runtime-validation"
  become: true
  become_user: "{{ archsetup_desktop_user }}"
  changed_when: false
  register: desktop_config_validation
  failed_when: desktop_config_validation.rc != 0 or 'config ok' not in desktop_config_validation.stdout
  when: not ansible_check_mode

- name: Record owned profile
  ansible.builtin.copy:
    content: "ArchSetup desktop configuration v1\n"
    dest: "{{ desktop_root }}/.managed"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'

- name: Ensure session installation directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/usr/local/bin, /usr/share/wayland-sessions]

- name: Install isolated session launcher
  ansible.builtin.copy:
    src: archsetup-session
    dest: /usr/local/bin/archsetup-session
    mode: '0755'

- name: Register desktop session
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=ArchSetup Hyprland
      Comment=Material-inspired desktop
      Exec=/usr/local/bin/archsetup-session
      Type=Application
      DesktopNames=Hyprland
    dest: /usr/share/wayland-sessions/archsetup.desktop
    mode: '0644'

- name: Set browser associations without replacing unrelated MIME entries
  community.general.ini_file:
    path: "{{ desktop_home }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: "{{ archsetup_desktop_browser }}"
    no_extra_spaces: true
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    backup: true
  loop: [x-scheme-handler/http, x-scheme-handler/https, text/html]

- name: Enable network management
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: started
  when:
    - archsetup_desktop_manage_network | bool
    - not ansible_check_mode or 'NetworkManager.service' in ansible_facts.services

- name: Detect Bluetooth kernel support
  ansible.builtin.stat:
    path: /sys/class/bluetooth
  register: desktop_bluetooth

- name: Enable Bluetooth and start it only when supported
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true
    state: "{{ 'started' if desktop_bluetooth.stat.exists else omit }}"
  when: not ansible_check_mode or 'bluetooth.service' in ansible_facts.services
