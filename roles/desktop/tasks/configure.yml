---
- name: Back up a pre-existing unmanaged profile once
  ansible.builtin.command:
    argv: [cp, -a, --, "{{ desktop_root }}", "{{ desktop_root }}.pre-archsetup"]
    creates: "{{ desktop_root }}.pre-archsetup"
  when:
    - desktop_existing.results[0].stat.exists
    - not desktop_existing.results[1].stat.exists
    - archsetup_desktop_adopt | bool

- name: Create owned configuration directories
  ansible.builtin.file:
    path: "{{ desktop_root }}/{{ item }}"
    state: directory
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0755'
  loop: ['', shell, bin]

- name: Create private configuration-validation runtime directory
  ansible.builtin.file:
    path: "{{ desktop_root }}/.runtime-validation"
    state: directory
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0700'

- name: Install original shell and helper sources
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ desktop_root }}/{{ item.dest }}"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: "{{ item.mode }}"
  loop:
    - {src: 'shell/', dest: 'shell/', mode: '0644'}
    - {src: desktop-action, dest: bin/desktop-action, mode: '0755'}
    - {src: session-services, dest: bin/session-services, mode: '0755'}
    - {src: validate-config, dest: bin/validate-config, mode: '0755'}
    - {src: shortcuts.json, dest: shortcuts.json, mode: '0644'}

- name: Install Hyprlock authentication and keyring integration
  ansible.builtin.copy:
    src: archsetup-hyprlock.pam
    dest: /etc/pam.d/archsetup-hyprlock
    owner: root
    group: root
    mode: '0644'
    backup: true

- name: Render desktop configuration
  become: true
  become_user: "{{ archsetup_desktop_user }}"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ desktop_root }}/{{ item }}"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    backup: true
    validate: "{{ desktop_root + '/bin/validate-config %s' if item == 'hyprland.lua' else omit }}"
  loop: [hyprland.lua, hyprlock.conf, hypridle.conf, fuzzel.ini, kitty.conf, swaync.json, swaync.css, preferences.json]

- name: Initialize user-owned appearance state
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ desktop_root }}/state.json"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0600'
    force: false

- name: Validate rendered compositor configuration
  ansible.builtin.command:
    argv: [Hyprland, --verify-config, --config, "{{ desktop_root }}/hyprland.lua"]
  environment:
    XDG_RUNTIME_DIR: "{{ desktop_root }}/.runtime-validation"
  become: true
  become_user: "{{ archsetup_desktop_user }}"
  changed_when: false
  register: desktop_config_validation
  failed_when: desktop_config_validation.rc != 0 or 'config ok' not in desktop_config_validation.stdout
  when: not ansible_check_mode

- name: Record owned profile
  ansible.builtin.copy:
    content: "ArchSetup desktop configuration v1\n"
    dest: "{{ desktop_root }}/.managed"
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'

- name: Ensure session installation directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop: [/usr/local/bin, /usr/share/wayland-sessions]

- name: Install isolated session launcher
  ansible.builtin.copy:
    src: archsetup-session
    dest: /usr/local/bin/archsetup-session
    mode: '0755'

- name: Register desktop session
  ansible.builtin.copy:
    content: |
      [Desktop Entry]
      Name=ArchSetup Hyprland
      Comment=Material-inspired desktop
      Exec=/usr/local/bin/archsetup-session
      Type=Application
      DesktopNames=Hyprland
    dest: /usr/share/wayland-sessions/archsetup.desktop
    mode: '0644'

- name: Set browser associations without replacing unrelated MIME entries
  community.general.ini_file:
    path: "{{ desktop_home }}/.config/mimeapps.list"
    section: Default Applications
    option: "{{ item }}"
    value: "{{ archsetup_desktop_browser }}"
    no_extra_spaces: true
    owner: "{{ archsetup_desktop_user }}"
    group: "{{ desktop_group }}"
    mode: '0644'
    backup: true
  loop: [x-scheme-handler/http, x-scheme-handler/https, text/html]

- name: Enable network management
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    enabled: true
    state: started
  when:
    - archsetup_desktop_manage_network | bool
    - not ansible_check_mode or 'NetworkManager.service' in ansible_facts.services

- name: Detect Bluetooth kernel support
  ansible.builtin.stat:
    path: /sys/class/bluetooth
  register: desktop_bluetooth

- name: Enable Bluetooth and start it only when supported
  ansible.builtin.systemd_service:
    name: bluetooth.service
    enabled: true
    state: "{{ 'started' if desktop_bluetooth.stat.exists else omit }}"
  when: not ansible_check_mode or 'bluetooth.service' in ansible_facts.services
