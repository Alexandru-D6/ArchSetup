---
- name: Enable the Tailscale daemon
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true
    state: started
  when: not ansible_check_mode or 'tailscaled.service' in ansible_facts.services | default({})

- name: Read the current Tailscale operator
  ansible.builtin.command:
    argv: [tailscale, debug, prefs]
  register: desktop_tailscale_preferences
  changed_when: false
  check_mode: false
  no_log: true
  when: not ansible_check_mode

- name: Allow the desktop account to manage Tailscale
  ansible.builtin.command:
    argv: [tailscale, set, "--operator={{ archsetup_desktop_user }}"]
  when:
    - not ansible_check_mode
    - (desktop_tailscale_preferences.stdout | from_json).OperatorUser | default('') != archsetup_desktop_user
