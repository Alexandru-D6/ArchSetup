---
archsetup_desktop_enabled: false
archsetup_desktop_user: ""
archsetup_desktop_adopt: false
archsetup_desktop_manage_login: true
archsetup_desktop_autologin_locked: true
# Unlock first, then use the desktop session menu for shutdown/reboot.
archsetup_desktop_lock_require_auth_for_power: true
archsetup_desktop_manage_network: true
archsetup_desktop_browser: brave-browser.desktop
# Existing Brave is retained; missing Brave uses reviewed AUR packaging.
archsetup_desktop_install_brave: true
archsetup_desktop_brave_revision: 21e2273a1bc003bf35d00aebb40ef8c22b1a53fa
archsetup_desktop_require_browser: true
archsetup_desktop_quickshell_package: quickshell
archsetup_desktop_monitors:
  - {output: "", mode: preferred, position: auto, scale: auto}
archsetup_desktop_input:
  kb_layout: us,us
  kb_variant: euro,altgr-intl
  kb_options: grp:win_space_toggle
  numlock_by_default: true
  repeat_delay: 250
  repeat_rate: 35
  follow_mouse: 1
  off_window_axis_events: 2
  accel_profile: flat
  force_no_accel: 1
  sensitivity: 0.0
  touchpad:
    natural_scroll: true
    disable_while_typing: true
    clickfinger_behavior: true
    scroll_factor: 0.7
archsetup_desktop_reduced_motion: false
archsetup_desktop_software_cursor: true
archsetup_desktop_font: DejaVu Sans
archsetup_desktop_theme: rose
# Shared point size for the session menu and lock-screen labels/controls.
archsetup_desktop_control_font_size: 12
archsetup_desktop_code_editor: codium.desktop
# Existing VSCodium is retained; missing VSCodium uses reviewed AUR packaging.
archsetup_desktop_install_vscodium: true
archsetup_desktop_vscodium_revision: d04471d2fba90dc9fc16d52be8e6f957061b5ab3
archsetup_desktop_text_editor: org.xfce.mousepad.desktop
archsetup_desktop_office: libreoffice-startcenter.desktop
archsetup_desktop_ocr_language: eng
archsetup_desktop_lock_seconds: 300
archsetup_desktop_dpms_seconds: 600
archsetup_desktop_packages:
  - hyprland
  - "{{ archsetup_desktop_quickshell_package }}"
  - hyprlock
  - hypridle
  - hyprsunset
  - kitty
  - mousepad
  - libreoffice-fresh
  - btop
  - thunar
  - fuzzel
  - pipewire
  - pipewire-pulse
  - wireplumber
  - networkmanager
  - bluez
  - bluez-utils
  - blueman
  - pavucontrol
  - network-manager-applet
  - polkit-gnome
  - gnome-keyring
  - libsecret
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - xdg-utils
  - wl-clipboard
  - cliphist
  - grim
  - wf-recorder
  - libpulse
  - tesseract-data-eng
  - xdg-user-dirs
  - slurp
  - hyprpicker
  - playerctl
  - brightnessctl
  - libnotify
  - gtk3
  - upower
  - jq
  - python
  - python-pillow
  - fontconfig
  - noto-fonts
  - noto-fonts-emoji
  - ttf-dejavu
  - papirus-icon-theme
archsetup_desktop_login_packages: [greetd, greetd-tuigreet]
