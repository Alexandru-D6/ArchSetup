---
archsetup_desktop_enabled: false
archsetup_desktop_user: ""
archsetup_desktop_adopt: false
archsetup_desktop_manage_login: true
archsetup_desktop_autologin_locked: true
archsetup_desktop_manage_network: true
archsetup_desktop_browser: brave-browser.desktop
# Existing Brave is retained. On fresh machines supply a reviewed package source
# and install it before applying this profile (Brave is not in official repos).
archsetup_desktop_require_browser: true
archsetup_desktop_quickshell_package: quickshell
archsetup_desktop_monitors:
  - {output: "", mode: preferred, position: auto, scale: auto}
archsetup_desktop_input:
  kb_layout: us,us
  kb_variant: euro,altgr-intl
  kb_options: grp:win_space_toggle
  numlock_by_default: true
  repeat_delay: 250
  repeat_rate: 35
  follow_mouse: 1
  off_window_axis_events: 2
  accel_profile: flat
  force_no_accel: 1
  sensitivity: 0.0
  touchpad:
    natural_scroll: true
    disable_while_typing: true
    clickfinger_behavior: true
    scroll_factor: 0.7
archsetup_desktop_reduced_motion: false
archsetup_desktop_lock_seconds: 300
archsetup_desktop_dpms_seconds: 600
archsetup_desktop_packages:
  - hyprland
  - "{{ archsetup_desktop_quickshell_package }}"
  - hyprlock
  - hypridle
  - kitty
  - thunar
  - fuzzel
  - swaync
  - pipewire
  - pipewire-pulse
  - wireplumber
  - networkmanager
  - bluez
  - bluez-utils
  - blueman
  - pavucontrol
  - network-manager-applet
  - polkit-gnome
  - gnome-keyring
  - xdg-desktop-portal-hyprland
  - xdg-desktop-portal-gtk
  - xdg-utils
  - wl-clipboard
  - cliphist
  - grim
  - slurp
  - hyprpicker
  - playerctl
  - brightnessctl
  - libnotify
  - gtk3
  - upower
  - jq
  - python
  - python-pillow
  - noto-fonts
  - noto-fonts-emoji
  - ttf-dejavu
  - papirus-icon-theme
archsetup_desktop_login_packages: [greetd, greetd-tuigreet]
