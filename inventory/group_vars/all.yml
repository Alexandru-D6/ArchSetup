---
# Official Arch packages installed by `./setup.sh apply`.
# Removing a name from this list does not uninstall it; use the removal list below.
archsetup_cli_packages:
  - base-devel
  - bash-completion
  - bat
  - btop
  - curl
  - fd
  - fzf
  - git
  - jq
  - less
  - man-db
  - man-pages
  - nano
  - openssh
  - pacman-contrib
  - ripgrep
  - rsync
  - tmux
  - tree
  - unzip
  - wget
  - which
  - vim

# Packages that `./setup.sh apply` must remove. List a package here only after
# reviewing pacman's transaction. This list takes precedence if a package is also
# in archsetup_cli_packages. Pacman retains modified configuration as a .pacsave
# file and refuses removals needed by another installed package.
archsetup_cli_packages_absent: [
  zip
]
